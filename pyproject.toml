[project]
name = "szl-os"
version = "0.1.0"
description = "SZL Sovereign OS — fail-closed operator kernel"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SZL Holdings" }]
keywords = ["governed-ai", "operator-kernel", "fail-closed", "receipts", "szl-holdings"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# The suite is stdlib unittest, so the extra pulls in nothing; it exists so the
# documented `pip install -e '.[test]'` resolves without an unknown-extra warning.
test = []

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-sovereign-os"
Source = "https://github.com/szl-holdings/szl-sovereign-os"
Issues = "https://github.com/szl-holdings/szl-sovereign-os/issues"
Changelog = "https://github.com/szl-holdings/szl-sovereign-os/releases"

[tool.setuptools.packages.find]
include = ["szl_os*"]

[tool.szl.release]
import_names = ["szl_os"] # wheel top-level import names; the release gate fails if the built wheel differs

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
